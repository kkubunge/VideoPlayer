name: Android Build

# 로컬에 Android 툴체인이 없어도 빌드가 되는지 확인하고 APK를 받기 위한 워크플로.
# 성공하면 Actions 실행 화면 하단 Artifacts에서 app-debug-apk 를 내려받을 수 있다.
# 실패하면 오류 로그를 ci-logs/last-build-errors.md 로 커밋해 둔다.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 디버그 APK 빌드
    runs-on: ubuntu-latest

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 디버그 서명 키 준비
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -e
          if [ -f app/debug.keystore ]; then
            echo "고정 디버그 키가 이미 있다."
            exit 0
          fi

          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f app/debug.keystore
          git commit -m "CI: 고정 디버그 서명 키 추가 [skip ci]"
          git push origin HEAD:master

      - name: Android SDK 준비
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Gradle 8.9 준비
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: testAndAssembleDebug
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon \
            -PbuildId="${GITHUB_SHA:0:7}" \
            -PversionCode="${GITHUB_RUN_NUMBER}" 2>&1 | tee build-output.txt

      - name: APK 업로드
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: latest 릴리스 갱신
        if: success() && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cp "$(ls app/build/outputs/apk/debug/*.apk | head -1)" VideoPlayer-debug.apk

          gh release delete latest --yes --cleanup-tag 2>/dev/null || true

          gh release create latest VideoPlayer-debug.apk \
            --title "최신 디버그 빌드" \
            --target "${GITHUB_SHA}" \
            --latest \
            --notes "master 최신 커밋(\`${GITHUB_SHA:0:7}\`)으로 만든 디버그 APK입니다.

          아래 \`VideoPlayer-debug.apk\`를 눌러 받은 뒤 설치하세요.
          설치하려면 기기에서 '출처를 알 수 없는 앱 설치'를 허용해야 합니다.

          디버그 키로 서명된 테스트용 빌드이며, Play 스토어 배포본이 아닙니다."

      - name: 실패 로그 커밋
        if: failure() && github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p ci-logs
          {
            echo "# 빌드 실패 로그"
            echo
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '## 컴파일 오류 (e: / FAILURE / what went wrong)'
            echo '```'
            grep -E '^(e: |w: .*[Ee]rror|FAILURE:|\* What went wrong:|Caused by:|> )' build-output.txt | head -300 || echo '(해당 패턴 없음)'
            echo '```'
            echo
            echo '## 전체 로그 끝부분 (400줄)'
            echo '```'
            tail -n 400 build-output.txt
            echo '```'
          } > ci-logs/last-build-errors.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/last-build-errors.md
          git commit -m "CI: 빌드 실패 로그 기록 [skip ci]"
          git push origin HEAD:master

      - name: 실패 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build-output.txt
            app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
